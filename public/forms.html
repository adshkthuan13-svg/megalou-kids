<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <!-- Netlify Form Definition -->
    <!-- This file is used to allow Netlify to detect the form during build time -->
    <form name="alpha-signup" netlify netlify-honeypot="bot-field" hidden>
        <input type="email" name="email" />
        <input type="hidden" name="form-name" value="alpha-signup" />
    </form>
</body>
</html>
